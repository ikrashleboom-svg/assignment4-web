<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1 class="mb-4">Contact us</h1>

    <form action="#" method="post">
      <div class="row g-3">

        <div class="col-12">
          <label for="name" class="form-label">Your name:</label>
          <input type="text" class="form-control is-valid" id="name" name="user_name"
                 value="Marlen" placeholder="Name" required minlength="2" maxlength="50">
          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback">Name is required (at least 2 characters)</div>
        </div>

        <div class="col-12">
          <label for="email" class="form-label">Email:</label>
          <input type="email" class="form-control is-invalid" id="email" name="email"
                 value="mrln@" placeholder="example@gmail.com" required>
          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback">Email is required and must be correct</div>
        </div>

        <div class="col-12">
          <label for="message" class="form-label">Feedback:</label>
          <textarea class="form-control is-invalid" id="message" name="message" rows="5"
                    placeholder="enter message" required minlength="10" maxlength="500"></textarea>
          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback">Message is required (at least 10 characters)</div>
        </div>

        <div class="col-12">
          <button type="submit" class="btn btn-primary" id="submit"></button>
        </div>

      </div>
    </form>

  </div>

</body>
</html>
